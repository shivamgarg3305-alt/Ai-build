name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No dependencies needed: the scanner uses only Node built-ins.
      - name: Scan files that would be committed
        run: node scripts/check-secrets.mjs

  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # No linter is configured in this repository yet; TypeScript strict mode is the static check.
      - name: Tests (API, web, repository scripts)
        run: npm test
      - name: Production build
        run: npm run build
      - name: Dependency audit (production dependencies, high severity and above)
        run: npm audit --omit=dev --audit-level=high
